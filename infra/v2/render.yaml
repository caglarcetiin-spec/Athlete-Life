# Reference for the EXISTING Python/free service; do not create a second service.
# Apply settings only after Mongo acceptance and controlled account cutover.
services:
  - type: web
    name: Athlete-Life
    runtime: python
    region: frankfurt
    plan: free
    branch: codex/alos-2-stage-0
    buildCommand: pip install -r apps/api/requirements.lock && npm ci --prefix apps/web && npm --prefix apps/web run build
    startCommand: python -m alos.cli schema-check && python -m alos.cli serve
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: NODE_VERSION
        value: 24.19.0
      - key: PYTHONPATH
        value: apps/api
      - key: ALOS_V2_ENABLED
        value: "1"
      - key: ALOS_V2_ENVIRONMENT
        value: production
      - key: ALOS_V2_DATABASE_URL
        sync: false
      - key: ALOS_V2_MONGO_DATABASE
        sync: false
      - key: ALOS_V2_PUBLIC_ORIGIN
        value: https://athlete-life.onrender.com
      - key: ALOS_V2_REGISTRATION_ENABLED
        value: "0"
# No database, disk, Redis, worker or paid resource is provisioned here.
# Explicit migrate creates only alos_v2_* collections, never copies v10 accounts.
